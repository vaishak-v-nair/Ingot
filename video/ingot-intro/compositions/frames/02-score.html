  <script>
    (function () {

      var tl = gsap.timeline({ paused: true });

      var DUR = 3.605;
      var lines = [

        document.getElementById("02-score-line-2"),

      /* discrete-text-sequence at line granularity: whole-line states replace

      var SEQUENCE = [
        { t: 0.0, on: [false, false, false] }, // bare graphite beat out of the crossfade
        { t: 0.45, on: [true, false, false] }, // "a score." — VO: "every answer was a score"

      ];
      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var s = stateAt(driver.t);
            for (var i = 0; i < 3; i++) {

      tl.fromTo(
        lines[0],

        { y: -175, duration: 0.9, ease: "expo.out", immediateRender: false },

      tl.fromTo(
        lines[0],
        { opacity: 1 },

        { y: -175 },
        { y: -350, duration: 0.9, ease: "expo.out", immediateRender: false },
