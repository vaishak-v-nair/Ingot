  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---- macro camera: one slow linear drift under the whole shot ---- */
      tl.fromTo(".f06-stage", { scale: 1 }, { scale: 1.022, duration: 7.68, ease: "none" }, 0);

      tl.fromTo(

      /* …then the ruled panel tears downward from it */

      var f06CounterEl = document.getElementById("f06-counter");
      var f06Fmt = function (n) {

          ease: "power3.out",

            f06CounterEl.textContent = f06Fmt(Math.round(f06Count.v));
