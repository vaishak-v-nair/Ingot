name: pages

# Publishes the scanner and the registry to GitHub Pages.
#
# Requires Pages to be enabled for the repository with "GitHub Actions" as the source.
# Until it is, this workflow fails on the deploy step and nothing else is affected.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache benchmark data
        id: bench
        uses: actions/cache@v4
        with:
          path: ingot-bench
          key: benchmarks-v1

      - name: Fetch benchmarks
        if: steps.bench.outputs.cache-hit != 'true'
        run: |
          node scripts/fetch-benchmarks.ts
          cp -r data ingot-bench

      - name: Restore cached benchmarks
        if: steps.bench.outputs.cache-hit == 'true'
        run: cp -r ingot-bench data

      # The bundle and the published indexes. Indexes carry one-way hashes and item ids
      # only, never benchmark text, so serving them redistributes nothing.
      - name: Build the scanner
        run: node scripts/build-web.ts

      # Generated from the committed results, so the page cannot drift from the scan that
      # produced it.
      - name: Build the registry page
        run: node scripts/build-registry-page.ts

      # Was inline bash here, which made the gate a property of this workflow rather than
      # of the site — a second host building the same repository would have published
      # pages that passed none of it. It is scripts/check-site.ts so every host runs the
      # identical check and so it can be run locally before pushing.
      - name: Check the site is complete before publishing it
        run: node scripts/check-site.ts

      - name: Check every published figure still traces to results/
        run: node scripts/check-published-numbers.ts

      # Measured, not assumed: enablement:true was tried and GitHub refused it with
      # "Resource not accessible by integration" on POST /repos/{owner}/{repo}/pages.
      # GITHUB_TOKEN's `pages: write` grants DEPLOYING to Pages, not CREATING the site,
      # which needs admin rights a workflow token does not have. So a human has to enable
      # it once, and the only thing this workflow can usefully do is say so clearly
      # instead of failing on an HttpError nobody can act on.
      - name: Pages must be enabled before this can deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::Enable it once, then re-run this workflow."
            echo
            echo "  https://github.com/${{ github.repository }}/settings/pages"
            echo "  Build and deployment -> Source -> GitHub Actions"
            echo
            echo "This cannot be automated: creating a Pages site needs admin rights, and"
            echo "GITHUB_TOKEN only has permission to deploy to a site that already exists."
            echo "Everything before this step passed, so the site builds correctly and is"
            echo "waiting on that one setting."
            exit 1
          fi
          echo "Pages is enabled (HTTP $code) — continuing."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
