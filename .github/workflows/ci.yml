name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Upstream corpora can change under us. A weekly run turns "the published numbers no
  # longer reproduce" into a notification rather than something a reader discovers.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Built first so the bundle test runs for real instead of skipping. The page loads
      # the bundle, and a bundling regression passes every other test in the suite.
      - name: Build the browser bundle
        run: node scripts/build-web.ts --bundle-only

      - name: Run the test suite
        run: node --test test/*.test.ts

  e2e:
    name: the real page in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The suite drives the shipped page — index.html, ingot.js, scan.worker.js — in
      # headless Chrome (preinstalled on the runner) against synthetic indexes, so it
      # needs no benchmark downloads and asserts exact numbers: the worker round-trip,
      # the refusal states, cancel and double-drop, and gzip-vs-plain hash parity.
      - name: Build the browser bundles
        run: node scripts/build-web.ts --bundle-only

      - name: Run the e2e suite
        run: node e2e/run.ts

  package:
    name: npx works for a stranger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The published package cannot ship raw TypeScript: Node refuses to strip types under
      # node_modules, so a package that runs from source installs fine and then fails on
      # first use. Only an install-and-run proves it works, so that is what this does.
      - name: Pack, install into a clean directory, and run
        run: |
          set -euo pipefail
          npm pack
          mkdir -p /tmp/stranger && cd /tmp/stranger
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/ingot-scan-*.tgz
          cp "$GITHUB_WORKSPACE/web/sample-corpus.jsonl" mine.jsonl
          npx ingot contaminate --index humaneval --corpus mine.jsonl | tee out.txt
          grep -q "HumanEval-78" out.txt
          grep -q "prime numbers are 2, 3, 5, 7, 11, 13, 17" out.txt
          grep -q "RECEIPT" out.txt

  validate:
    name: detection still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache reference corpora
        id: corpora
        uses: actions/cache@v4
        with:
          path: ingot-data
          key: corpora-v1

      - name: Fetch reference corpora
        if: steps.corpora.outputs.cache-hit != 'true'
        run: |
          node scripts/fetch-corpora.ts
          cp -r data ingot-data

      - name: Restore cached corpora
        if: steps.corpora.outputs.cache-hit == 'true'
        run: cp -r ingot-data data

      # The harness exits non-zero when planted verbatim recall is below 100%. That is a
      # pass/fail assertion, not a metric: a verbatim copy that the scanner misses is a bug.
      - name: Planted recall, false positives, n sweep
        run: node scripts/contamination-validate.ts

      # Every number published in the README and on the site comes out of this file. If a
      # change moves them, the change updates them here in the same commit, or the claims
      # on the front page stop being true.
      - name: Published numbers still reproduce
        run: |
          if ! git diff --exit-code --stat results/contamination-validation.json; then
            echo
            echo "::error::The validation output no longer matches results/contamination-validation.json."
            echo "Re-run 'node scripts/contamination-validate.ts', read the diff, and update"
            echo "README.md, docs/measurements.md and web/index.html to match before committing."
            git diff results/contamination-validation.json
            exit 1
          fi

      # The step above proves the results files still reproduce. This one proves the PROSE
      # still matches those files. They are different failures: a re-run that moves a number
      # leaves every document quoting the old one, and nothing caught that until now. The
      # report argues that published figures drift from what was measured; shipping it
      # without this check would have been the same mistake in the same repository.
      - name: Published prose still matches the results files
        run: node scripts/check-published-numbers.ts
