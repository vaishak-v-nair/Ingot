name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Upstream corpora can change under us. A weekly run turns "the published numbers no
  # longer reproduce" into a notification rather than something a reader discovers.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Nothing here writes to the repository; say so, so the default token cannot either.
permissions:
  contents: read

jobs:
  test:
    name: tests
    # Windows is in the matrix because the maintainer develops there and the repo has
    # already hit a Windows-only failure (spawnSync npx.cmd EINVAL, scripts/npx.ts) that
    # no ubuntu job can reproduce.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every action is pinned to a commit rather than a tag. A tag is a mutable pointer,
      # and this repository publishes to npm with provenance — a workflow is part of the
      # supply chain the threat model claims to cover, so it gets the same treatment as the
      # esbuild pin. The trailing comment is the human-readable version; the SHA is what
      # actually runs.
      #
      # package-manager-cache is off deliberately. setup-node v5 and later start caching
      # automatically when package.json carries a packageManager field, and caching needs a
      # lockfile. This repo has zero dependencies by design and no lockfile at all, so the
      # feature does nothing today and would fail the first build after somebody adds that
      # field. Off on purpose beats off by luck.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Built first so the bundle test runs for real instead of skipping. The page loads
      # the bundle, and a bundling regression passes every other test in the suite.
      - name: Build the browser bundle
        run: node scripts/build-web.ts --bundle-only

      - name: Run the test suite
        shell: bash
        run: node --test test/*.test.ts

  e2e:
    name: the real page in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The suite drives the shipped page — index.html, ingot.js, scan.worker.js — in
      # headless Chrome (preinstalled on the runner) against synthetic indexes, so it
      # needs no benchmark downloads and asserts exact numbers: the worker round-trip,
      # the refusal states, cancel and double-drop, and gzip-vs-plain hash parity.
      - name: Build the browser bundles
        run: node scripts/build-web.ts --bundle-only

      - name: Run the e2e suite
        run: node e2e/run.ts

  package:
    name: npx works for a stranger
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The published package cannot ship raw TypeScript: Node refuses to strip types under
      # node_modules, so a package that runs from source installs fine and then fails on
      # first use. Only an install-and-run proves it works, so that is what this does.
      # shell: bash on both platforms — Git Bash's /tmp keeps the paths portable, and the
      # windows leg is the regression net for the npx.cmd spawn class.
      - name: Pack, install into a clean directory, and run
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          mkdir -p /tmp/stranger && cd /tmp/stranger
          npm init -y > /dev/null
          npm install /tmp/ingot-scan-*.tgz
          cp "$GITHUB_WORKSPACE/web/sample-corpus.jsonl" mine.jsonl
          npx ingot contaminate --index humaneval --corpus mine.jsonl | tee out.txt
          grep -q "HumanEval-78" out.txt
          grep -q "prime numbers are 2, 3, 5, 7, 11, 13, 17" out.txt
          grep -q "RECEIPT" out.txt

  validate:
    name: detection still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The key rotates weekly. With a fixed key the cache never expired, so the weekly
      # scheduled run — whose stated purpose is catching upstream drift — always restored
      # last week's bytes and could not see upstream change. A fresh key each ISO week
      # forces one re-fetch; pushes within the week still hit.
      - name: Compute the cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The fetch script's hash is part of the key: a PR that changes WHAT is fetched must
      # not validate against last week's bytes fetched by the old script.
      - name: Cache reference corpora
        id: corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ingot-data
          key: corpora-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/fetch-corpora.ts') }}

      - name: Fetch reference corpora
        if: steps.corpora.outputs.cache-hit != 'true'
        run: |
          node scripts/fetch-corpora.ts
          cp -r data ingot-data

      - name: Restore cached corpora
        if: steps.corpora.outputs.cache-hit == 'true'
        run: cp -r ingot-data data

      # The harness exits non-zero when planted verbatim recall is below 100%. That is a
      # pass/fail assertion, not a metric: a verbatim copy that the scanner misses is a bug.
      - name: Planted recall, false positives, n sweep
        run: node scripts/contamination-validate.ts

      # Every number published in the README and on the site comes out of this file. If a
      # change moves them, the change updates them here in the same commit, or the claims
      # on the front page stop being true.
      - name: Published numbers still reproduce
        run: |
          if ! git diff --exit-code --stat results/contamination-validation.json; then
            echo
            echo "::error::The validation output no longer matches results/contamination-validation.json."
            echo "Re-run 'node scripts/contamination-validate.ts', read the diff, and update"
            echo "README.md, docs/measurements.md and web/index.html to match before committing."
            git diff results/contamination-validation.json
            exit 1
          fi

      # The prose check gates web/registry.html too, and that page is a build artifact —
      # gitignored, so a checkout does not contain it. Generated here from the committed
      # results files, exactly as the deploy build generates it before running the same gate.
      - name: Build the registry page
        run: node scripts/build-registry-page.ts

      # web/sample-report.html is committed, unlike the registry page, because it is what a
      # visitor is shown as an example of the report they would be sent. It was made by hand
      # once and then edited by hand, so it could drift from the renderer and nothing would
      # say so. This rebuilds it and refuses any difference: the published example is the
      # real artifact or it is not published.
      - name: The published sample report is the renderer's output
        run: |
          node scripts/build-sample-report.ts
          if ! git diff --quiet -- web/sample-report.html; then
            echo "web/sample-report.html is not what scripts/build-sample-report.ts produces."
            echo "Run 'node scripts/build-sample-report.ts' and commit the result — do not"
            echo "edit that file by hand."
            git diff --stat -- web/sample-report.html
            exit 1
          fi

      # The step above proves the results files still reproduce. This one proves the PROSE
      # still matches those files. They are different failures: a re-run that moves a number
      # leaves every document quoting the old one, and nothing caught that until now. The
      # report argues that published figures drift from what was measured; shipping it
      # without this check would have been the same mistake in the same repository.
      - name: Published prose still matches the results files
        run: node scripts/check-published-numbers.ts

      # Until now this gate ran only inside the Vercel deploy build, so a PR that broke
      # site completeness or added a third-party origin merged green and main silently
      # stopped deploying. CI runs the identical sequence the deploy build runs.
      #
      # "Identical" has to be literal, and for a day it was not. This job built with
      # --bundle-only, which prints "skipping indexes" and exits before writing any, and
      # then asked check-site whether the site was COMPLETE — where completeness includes
      # web/indexes/mmlu.idx.bin.gz, the 5.35 MB that .gitignore deliberately keeps out of
      # the repository. The gate was being asked a question about a tree that could not
      # answer yes, so main went red on every push while the deploy stayed green. The
      # benchmarks are fetched and the indexes built for real, exactly as Vercel does it.
      # Worth the minute: this is the only place in CI where the index encoder runs against
      # a real benchmark rather than a fixture.
      #
      # Ordered after the corpora steps deliberately. Those run `cp -r ingot-data data`,
      # which copies INTO data/ instead of creating it when data/ already exists — a
      # benchmark cache restored earlier would leave data/ingot-data/ and break the
      # validation above with a file-not-found on the corpora.
      - name: Cache benchmarks
        id: benchmarks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/bench
          key: bench-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/fetch-benchmarks.ts') }}

      - name: Fetch benchmarks
        if: steps.benchmarks.outputs.cache-hit != 'true'
        run: node scripts/fetch-benchmarks.ts

      # Must run BEFORE the build, and the ordering is the whole point: build-web.ts
      # overwrites web/indexes/, so afterwards the "committed" files on disk are the rebuild
      # and the comparison would pass by construction. Here it compares what the checkout
      # actually carries — the bytes that ship inside the npm tarball — against what this
      # code builds from the pinned benchmarks.
      - name: The npm tarball and the deployed site build the same indexes
        run: node scripts/check-index-parity.ts

      - name: Build the browser bundles and the indexes
        run: node scripts/build-web.ts

      - name: The site is complete and makes no third-party request
        run: node scripts/check-site.ts
