name: publish

# Publishes ingot-scan to npm via TRUSTED PUBLISHING (OIDC): no token is stored
# anywhere, and the 2FA-bypass tokens npm is deprecating are never needed. GitHub
# proves the workflow's identity to npm, npm mints a short-lived credential, and
# provenance is attached automatically.
#
# One-time setup on npmjs.com (account side, done by a human):
#   package ingot-scan → Settings → Trusted publisher → GitHub Actions →
#   owner: vaishak-v-nair · repo: Ingot · workflow: publish.yml · environment: (blank)
#
# Release flow after that: bump the version (npm version patch), push with the tag,
# publish a GitHub Release for it — this workflow does the rest.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      # A release tag that names one version while package.json holds another would
      # publish bytes under the wrong number with provenance attached. Assert they agree
      # before anything builds. workflow_dispatch runs have no tag and skip the check.
      - name: Release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $TAG does not match package.json $PKG. Not publishing."
            exit 1
          fi

      # The same gates a local publish would pass. prepack builds dist during publish.
      - name: Build the browser bundles
        run: node scripts/build-web.ts --bundle-only

      - name: Run the test suite
        run: node --test test/*.test.ts

      # The exact failure CI's package job exists to catch — installs fine, fails on first
      # use — checked here on the artifact actually being published, not just on pushes.
      - name: Pack, install into a clean directory, and run
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          mkdir -p /tmp/stranger && cd /tmp/stranger
          npm init -y > /dev/null
          npm install /tmp/ingot-scan-*.tgz
          cp "$GITHUB_WORKSPACE/web/sample-corpus.jsonl" mine.jsonl
          npx ingot contaminate --index humaneval --corpus mine.jsonl | tee out.txt
          grep -q "HumanEval-78" out.txt
          grep -q "RECEIPT" out.txt

      - name: Publish to npm
        run: npm publish
